[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-desktop-agent"
version = "0.1.0"
description = "Multimodal accessibility desktop control — an iPad sensor hub driving Windows desktop actions via local LLM inference."
readme = "README.md"
requires-python = ">=3.10"
# Dependencies are sourced from requirements.txt (single source of truth) — see
# [tool.setuptools.dynamic] below. Install the package editable so the domain
# packages (core, sensors, inference, …) import without sys.path hacks:
#     pip install -e .            # installs deps too
#     pip install -e . --no-deps  # if deps are already in the venv
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Flat application layout: the importable packages live at the repo root. List
# them explicitly so non-package trees (tests, docs, scripts, iPadApp, the Node
# sidecar, desktop-agent-bridge, _archive) are never picked up as installable packages.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "sensors*",
    "inference*",
    "tts*",
    "storage*",
    "calibration*",
    "desktop*",
    "adaptive*",
    "monitoring*",
    "mcp_server*",
    "skills*",
]
exclude = [
    "tests*",
    "_archive*",
    "docs*",
    "scripts*",
    "iPadApp*",
    "tts_service*",
    "desktop-agent-bridge*",
]

# NOTE: pytest configuration intentionally stays in pytest.ini (which takes
# precedence over pyproject). The root entry points (main.py, approval_hook.py,
# windows_action_proxy.py) remain run-directly scripts, not installed modules.

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["^scripts/"]

# ── Ruff (IG-2a, 2026-07-05 industry-patterns audit) ─────────────────────────
# First gate: pyflakes + pycodestyle errors only (explicit select). The ignores
# below are a deliberate ratchet — style-only rules with existing violations
# are parked, not endorsed. Tighten by deleting one ignore at a time and fixing
# what surfaces. Do NOT add new ignores without a docs/decisions.md entry.
[tool.ruff]
target-version = "py310"
extend-exclude = ["_archive", "iPadApp", "desktop_app", "tts_service", "desktop-agent-bridge"]

[tool.ruff.lint]
# Explicit select — this gate is pyflakes + pycodestyle errors only. This was
# ruff's default selection through 0.15.x; 0.16.0 widened the defaults (I, UP,
# BLE, DTZ, S, G, C4, …), which would flip this repo from green to ~hundreds of
# violations. Keep the selection pinned here so the gate never moves with ruff
# releases; widen deliberately, one rule family at a time.
select = ["E4", "E7", "E9", "F"]
# Parked (pre-existing style debt, ~180 hits):
#   E402 imports-after-code (deliberate sys.path setup in scripts/tests)
#   E702 semicolon one-liners (compact viewer/deck scripts)
#   E731 lambda assignment, E741 ambiguous names, F841 unused locals
ignore = ["E402", "E702", "E731", "E741", "F841"]
