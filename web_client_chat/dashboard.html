<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Agent — Observability</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="dash">
    <header class="pane-head">
      <span class="dot" id="conn-dot" title="disconnected"></span>
      <h1>Observability</h1>
      <span class="sub" id="conn-label">connecting…</span>
      <a class="navlink" href="/">← Chat</a>
    </header>

    <!-- NOW: live KPIs + backend-health strip -->
    <section class="panel">
      <div class="panel-head"><h2>Now</h2><span class="sub" id="now-sub">live</span></div>
      <div class="kpis" id="kpis"></div>
      <div class="health" id="health"></div>
    </section>

    <!-- TEXT EDITOR: open files here -->
    <section class="panel" id="text-editor-panel" style="display: none;">
      <div class="panel-head"><h2>Text Editor</h2><span class="sub" id="editor-file-path"></span></div>
      <textarea id="editor-textarea" style="width: 100%; height: 300px; font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 10px; border: 1px solid #333; resize: vertical;" readonly></textarea>
    </section>

    <!-- ALERTS: threshold + SLO breaches (durable) -->
    <section class="panel">
      <div class="panel-head"><h2>Alerts</h2><span class="sub" id="alerts-sub"></span></div>
      <div id="alerts" aria-live="polite"><div class="empty">no alerts</div></div>
    </section>

    <div class="grid2">
      <!-- ACTIVITY feed (live, broadcast) -->
      <section class="panel">
        <div class="panel-head"><h2>Activity</h2><span class="sub">background events</span></div>
        <div class="feed" id="feed"><div class="empty">waiting for events…</div></div>
      </section>

      <!-- TRACES + replay -->
      <section class="panel">
        <div class="panel-head">
          <h2>Traces</h2>
          <span class="trace-filters">
            <select id="tf-source"><option value="">all sources</option></select>
            <select id="tf-success">
              <option value="">all</option>
              <option value="1">ok</option>
              <option value="0">failed</option>
            </select>
          </span>
          <span class="sub" id="traces-sub"></span>
        </div>
        <div class="traces" id="traces"></div>
        <div class="replay" id="replay"><div class="empty">pick a trace to replay its timeline</div></div>
      </section>
    </div>

    <div class="grid2">
      <!-- TRENDS -->
      <section class="panel">
        <div class="panel-head"><h2>Trends</h2><span class="sub" id="trends-sub"></span></div>
        <div id="trends"></div>
      </section>

      <!-- MODEL USAGE -->
      <section class="panel">
        <div class="panel-head"><h2>Model usage</h2><span class="sub" id="models-sub"></span></div>
        <div id="models"></div>
      </section>
    </div>

    <div class="grid2">
      <!-- ROUTING: gate-decision breakdown -->
      <section class="panel">
        <div class="panel-head"><h2>Routing</h2><span class="sub" id="routing-sub"></span></div>
        <div id="routing"></div>
      </section>

      <!-- ERRORS: top inference failures -->
      <section class="panel">
        <div class="panel-head"><h2>Errors</h2><span class="sub" id="errors-sub"></span></div>
        <div id="errors"></div>
      </section>
    </div>

    <div class="grid2">
      <!-- COST: cloud spend per day -->
      <section class="panel">
        <div class="panel-head"><h2>Cloud cost</h2><span class="sub" id="cost-sub"></span></div>
        <div id="cost"></div>
      </section>

      <!-- GOALS: autonomous goal queue -->
      <section class="panel">
        <div class="panel-head"><h2>Goal queue</h2><span class="sub" id="goals-sub"></span></div>
        <div id="goals"></div>
      </section>
    </div>

    <div class="grid2">
      <!-- ESCALATIONS: dev runs needing review (read-only) -->
      <section class="panel">
        <div class="panel-head"><h2>Escalations</h2><span class="sub" id="escalations-sub"></span></div>
        <div id="escalations"></div>
      </section>

      <!-- CORRECTIONS: recent user corrections -->
      <section class="panel">
        <div class="panel-head"><h2>Corrections</h2><span class="sub" id="corrections-sub"></span></div>
        <div id="corrections"></div>
      </section>
    </div>
  </div>
  <script src="/static/dashboard.js"></script>
</body>
</html>
