<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Agent — Chat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Left: chat -->
    <section id="chat-pane">
      <header class="pane-head">
        <button type="button" class="collapse-btn tool" title="Toggle Chat Panel" onclick="document.getElementById('chat-pane').classList.toggle('collapsed')">▼</button>
        <span class="dot" id="conn-dot" title="disconnected"></span>
        <h1>Desktop Agent</h1>
        <span class="sub" id="conn-label">connecting…</span>
        <a class="navlink" href="/dashboard" style="color:var(--accent);text-decoration:none;font-size:13px;margin-left:16px;">Dashboard →</a>
        <button type="button" id="clear-history" class="tool" title="Clear the local transcript (agent history is unaffected)">Clear</button>
      </header>
      <div id="transcript" aria-live="polite"></div>
      <form id="composer" autocomplete="off">
        <div id="composer-tools">
          <button type="button" id="dir-btn" class="tool" title="Active directory">📁 <span id="dir-label">cwd</span></button>
          <button type="button" id="attach-btn" class="tool" title="Attach .pdf, .png, or .svg">📎</button>
          <input type="file" id="file-input" accept=".pdf,.png,.svg" multiple hidden>
          <div id="attach-chips"></div>
        </div>
        <div id="dir-panel" class="hidden">
          <div class="dir-list" id="dir-list"></div>
          <div class="dir-add">
            <input type="text" id="dir-input" placeholder="Type a folder path to switch to…">
            <button type="button" id="dir-set">Switch</button>
          </div>
          <div id="dir-confirm" class="hidden"></div>
        </div>
        <div id="composer-row">
          <textarea id="input" rows="1" placeholder="Ask the agent… (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="send" type="submit" title="Send">➤</button>
        </div>
      </form>
    </section>

    <!-- Right: live DAG preview -->
    <section id="dag-pane">
      <header class="pane-head">
        <button type="button" class="collapse-btn tool" title="Toggle Execution Graph" onclick="document.getElementById('dag-pane').classList.toggle('collapsed')">▼</button>
        <h2>Execution graph</h2>
        <span class="sub" id="dag-sub">idle</span>
      </header>
      <div id="dag-wrap"><div id="dag"></div></div>
      <div id="legend">
        <span><i class="sw pending"></i>pending</span>
        <span><i class="sw running"></i>running</span>
        <span><i class="sw success"></i>done</span>
        <span><i class="sw failed"></i>failed</span>
      </div>
    </section>
  </div>

  <!-- mermaid (client-side, same CDN module the diagrams skill uses) -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose", flowchart: { htmlLabels: true, curve: "basis" } });
    window.__mermaid = mermaid;
    window.dispatchEvent(new Event("mermaid-ready"));
  </script>
  <!-- Vendored (offline-safe): the transcript renderer must not depend on a CDN
       (specs/chat-workbench-parity R2.5) — unlike mermaid above, which only
       powers the optional DAG pane. -->
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/dag.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
