name: DesktopAgent
options:
  bundleIdPrefix: com.bradtarver
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.10"
  PRODUCT_BUNDLE_IDENTIFIER: com.bradtarver.DesktopAgent
  TARGETED_DEVICE_FAMILY: "2"
  SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  ENABLE_BITCODE: NO

targets:
  DesktopAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "DesktopAgent.entitlements"
          - "Info.plist"
    entitlements:
      path: DesktopAgent.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Desktop Agent
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundleIconName: AppIcon
        # Declares the app uses no non-exempt encryption (only standard HTTPS/WSS,
        # which is exempt). Without this, every TestFlight build lands as "Missing
        # Compliance" and won't install until the export question is answered by
        # hand in App Store Connect — which is why builds kept getting stuck.
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Used for voice keyword detection."
        NSSpeechRecognitionUsageDescription: "Used for on-device keyword matching."
        NSMotionUsageDescription: "Used for tilt-based cursor control."
        NSLocalNetworkUsageDescription: "Connects to the Desktop Agent bridge on your local network."
        NSBonjourServices:
          - "_desktop-agent._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

  # IG-6 (2026-07-05 audit): unit-test bundle so the 20 XCTest files in
  # ../Tests actually run in CI. XcodeGen sets TEST_HOST automatically from
  # the app-target dependency, which @testable import DesktopAgent needs.
  DesktopAgentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Tests
    dependencies:
      - target: DesktopAgent
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  DesktopAgent:
    build:
      targets:
        DesktopAgent: all
        DesktopAgentTests: [test]
    test:
      targets:
        - DesktopAgentTests
