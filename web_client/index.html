<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Desktop Agent</title>
<style>
:root {
  --bg: #1c1c1e; --surface: #2c2c2e; --surface2: #3a3a3c;
  --text: #f5f5f7; --text2: #98989d; --accent: #0a84ff;
  --green: #30d158; --yellow: #ffd60a; --red: #ff453a;
  --radius: 12px; --gap: 8px;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Connection banner */
#banner {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 4px 12px; font-size: 11px; color: var(--text2);
  background: var(--surface); border-radius: 20px;
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 100;
}
#banner .dot { width: 8px; height: 8px; border-radius: 50%; }
#banner.connected .dot { background: var(--green); }
#banner.connecting .dot { background: var(--yellow); }
#banner.disconnected .dot { background: var(--red); }

/* Tab bar */
#tabs {
  display: flex; border-top: 1px solid var(--surface2);
  background: var(--surface); padding: 6px 0 2px;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; color: var(--text2); background: none; border: none;
  padding: 4px 0; cursor: pointer;
}
.tab.active { color: var(--accent); }
.tab svg { width: 22px; height: 22px; fill: currentColor; }

/* Main content */
#content { flex: 1; overflow-y: auto; padding: 40px 12px 70px; }
.page { display: none; height: 100%; }
.page.active { display: flex; flex-direction: column; }

/* Command grid */
#cmd-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: var(--gap); padding: 8px 0;
}
.cmd-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 80px; background: var(--surface); border: none;
  border-radius: var(--radius); color: var(--text); font-size: 12px;
  cursor: pointer; transition: background 0.15s;
}
.cmd-btn:active { background: var(--accent); }
.cmd-btn .icon { font-size: 22px; }

/* Trackpad */
#trackpad-area {
  background: var(--surface); border-radius: var(--radius);
  touch-action: none; position: relative; flex: 1; min-height: 45vh;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px;
}
#trackpad-area .hint { color: var(--text2); font-size: 13px; pointer-events: none; }

/* Keypad */
#keypad-display {
  text-align: right; padding: 16px; font-size: 28px; font-family: 'SF Mono', monospace;
  min-height: 80px; display: flex; flex-direction: column; justify-content: flex-end;
}
#keypad-display .preview { font-size: 14px; color: var(--text2); }
#keypad-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px;
}
.key-btn {
  min-height: 56px; border: none; border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 18px;
  font-family: -apple-system, monospace; cursor: pointer;
}
.key-btn:active { background: var(--surface2); }
.key-btn.accent { background: var(--accent); color: #fff; }
.key-btn.wide { grid-column: span 2; }

/* Canvas */
#draw-canvas {
  flex: 1; background: var(--surface); border-radius: var(--radius);
  touch-action: none; min-height: 300px;
}
#draw-controls {
  display: flex; gap: 8px; padding: 12px; justify-content: flex-end;
}
#draw-controls button {
  padding: 8px 16px; border: none; border-radius: 8px;
  background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer;
}
#draw-controls .primary { background: var(--accent); }
#draw-result {
  padding: 12px; background: var(--surface); border-radius: var(--radius);
  font-family: monospace; font-size: 14px; display: none;
}
#draw-result input {
  flex: 1; background: var(--surface2); border: none; border-radius: 6px;
  color: var(--text); padding: 8px; font-family: monospace; font-size: 14px;
}

/* Settings */
.settings-section { margin-bottom: 20px; }
.settings-section h3 { font-size: 13px; color: var(--text2); text-transform: uppercase; margin-bottom: 8px; padding: 0 4px; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px; background: var(--surface); border-radius: var(--radius); margin-bottom: 4px;
}
.setting-row label { font-size: 15px; }
.setting-row input[type="text"], .setting-row input[type="number"] {
  background: var(--surface2); border: none; border-radius: 6px;
  color: var(--text); padding: 6px 10px; width: 140px; text-align: right; font-size: 15px;
}
.setting-row input[type="range"] { width: 140px; }
.toggle { position: relative; width: 50px; height: 30px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute; inset: 0; background: var(--surface2); border-radius: 15px;
  transition: 0.3s; cursor: pointer;
}
.toggle .slider::before {
  content: ''; position: absolute; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: 0.3s;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider::before { transform: translateX(20px); }
button.reconnect-btn {
  width: 100%; padding: 12px; background: var(--accent); border: none;
  border-radius: var(--radius); color: #fff; font-size: 15px; cursor: pointer; margin-top: 8px;
}

/* Status bar */
#status-bar {
  font-size: 11px; color: var(--text2); text-align: center; padding: 4px;
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 99;
}
</style>
</head>
<body>
<!-- Connection Banner -->
<div id="banner" class="disconnected"><span class="dot"></span><span id="banner-text">Disconnected</span></div>
<div id="status-bar"></div>

<!-- Content Pages -->
<div id="content">
  <!-- Commands + Trackpad Combined Page -->
  <div class="page active" id="page-commands">
    <!-- Trackpad — takes most of the space -->
    <div id="trackpad-area"><span class="hint">Drag to move · Tap to click · 2-finger for right-click</span></div>
    <!-- Click buttons — directly below trackpad -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0">
      <button class="cmd-btn" id="btn-click" style="min-height:56px;font-size:14px">👆 Click</button>
      <button class="cmd-btn" id="btn-rclick" style="min-height:56px;font-size:14px">👆 Right Click</button>
    </div>
    <!-- Copy/Paste — directly below click buttons -->
    <div style="display:flex;gap:8px;padding:4px 0">
      <button id="copy-btn" style="flex:1;padding:12px;background:var(--surface);border:2px solid var(--green);border-radius:10px;color:var(--green);font-size:15px;font-weight:600">📋 Copy</button>
      <button id="paste-btn" style="flex:1;padding:12px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;color:var(--accent);font-size:15px;font-weight:600">📌 Paste</button>
      <button class="cmd-btn" id="btn-undo" style="min-height:44px;font-size:12px;flex:0.6">↩ Undo</button>
    </div>
    <!-- Scroll + shortcuts — compact row -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:6px;padding:4px 0">
      <button class="cmd-btn" id="btn-scrollup" style="min-height:44px;font-size:11px">⬆️ Up</button>
      <button class="cmd-btn" id="btn-scrolldn" style="min-height:44px;font-size:11px">⬇️ Down</button>
      <button class="cmd-btn" id="btn-tab" style="min-height:44px;font-size:11px">⇥ Tab</button>
      <button class="cmd-btn" id="btn-enter" style="min-height:44px;font-size:11px">⏎ Enter</button>
      <button class="cmd-btn" id="btn-esc" style="min-height:44px;font-size:11px">✕ Esc</button>
      <button class="cmd-btn" id="btn-space" style="min-height:44px;font-size:11px">␣ Space</button>
    </div>
    <!-- App launchers + select mode -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 0">
      <button class="cmd-btn" id="btn-kiro" style="min-height:40px;font-size:10px">🟢 Kiro</button>
      <button class="cmd-btn" id="btn-claude" style="min-height:40px;font-size:10px">🟠 Claude</button>
      <button class="cmd-btn" id="btn-chrome" style="min-height:40px;font-size:10px">🌐 Chrome</button>
      <button class="cmd-btn" id="btn-screenshot" style="min-height:40px;font-size:10px">📷 Shot</button>
      <button id="select-toggle" style="min-height:40px;background:var(--surface);border:2px solid var(--surface2);border-radius:8px;color:var(--text);font-size:10px;font-weight:600">⬚ Select</button>
    </div>
  </div>

  <!-- Keypad Page -->
  <div class="page" id="page-keypad">
    <div id="keypad-display"><div id="expr">0</div><div class="preview" id="preview"></div></div>
    <div id="keypad-grid"></div>
  </div>

  <!-- Write Page -->
  <div class="page" id="page-write">
    <div style="padding:12px 0;height:100%;display:flex;flex-direction:column">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">✏️ Write with Apple Pencil</div>
      <input type="text" id="scribble-input" placeholder="Write here..." 
        style="width:100%;background:var(--surface);border:1px solid var(--surface2);border-radius:12px;color:var(--text);padding:24px;font-size:28px;flex:1;min-height:250px">
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button onclick="sendScribble()" style="flex:1;padding:16px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:600;min-height:56px">⌨️ Type</button>
        <button onclick="sendScribbleAs('OPEN')" style="flex:1;padding:16px;background:var(--surface2);border:none;border-radius:10px;color:var(--text);font-size:18px;min-height:56px">📂 Open</button>
        <button onclick="sendScribbleAs('HOTKEY')" style="flex:1;padding:16px;background:var(--surface2);border:none;border-radius:10px;color:var(--text);font-size:18px;min-height:56px">⌘ Hotkey</button>
      </div>
      <button onclick="document.getElementById('scribble-input').value=''" style="width:100%;padding:14px;background:var(--surface);border:none;border-radius:10px;color:var(--red);font-size:16px;margin-top:8px">Clear</button>
    </div>
  </div>

  <!-- Settings Page -->
  <div class="page" id="page-settings"></div>
</div>

<!-- Tab Bar -->
<div id="tabs">
  <button class="tab active" data-page="commands"><svg viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7v5c0 2.76 2.24 5 5 5s5-2.24 5-5V7c0-2.76-2.24-5-5-5zm1 10h-2V7h2v5z"/></svg>Control</button>
  <button class="tab" data-page="keypad"><svg viewBox="0 0 24 24"><text x="4" y="18" font-size="14" fill="currentColor">f(x)</text></svg>Keypad</button>
  <button class="tab" data-page="write"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Write</button>
  <button class="tab" data-page="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 018.4 12 3.61 3.61 0 0112 8.4a3.61 3.61 0 013.6 3.6 3.61 3.61 0 01-3.6 3.6z"/></svg>Settings</button>
</div>

<script src="app.js"></script>
</body>
</html>
