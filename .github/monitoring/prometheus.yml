global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'personal_desktop_agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: personal_desktop_agent
          env: development

  - job_name: 'windows_exporter'
    static_configs:
      - targets: ['host.docker.internal:9182']
        labels:
          role: windows

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          role: loki
