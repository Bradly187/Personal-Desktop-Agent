# IG-4 (2026-07-05 industry-patterns audit): automated dependency updates.
# Security updates open PRs immediately; version updates are weekly and grouped
# to keep PR noise low for a single-maintainer repo. Keep the manual security
# rationale comments in requirements.txt — Dependabot supplements, not replaces.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # kokoro-onnx 0.5.0 requires Python >=3.10,<3.14 but CI runs 3.14 —
      # pip install aborts, so every PR carrying it fails in ~1 min (see the
      # 9eb0af3 revert and PRs on 2026-07-13/2026-07-20). Remove this ignore
      # once a Py3.14-compatible kokoro-onnx release exists.
      - dependency-name: "kokoro-onnx"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/desktop_app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      desktop-app-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/tts_service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      tts-service-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
