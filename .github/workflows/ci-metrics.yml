name: CI - Full Test Suite
on:
  push:
    paths:
      - '.github/**'
      - 'metrics.py'
      - 'tests/**'
      - '**/*.py'
  pull_request:
    paths:
      - '.github/**'
      - 'metrics.py'
      - 'tests/**'
      - '**/*.py'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full test suite
        run: |
          pytest -q
