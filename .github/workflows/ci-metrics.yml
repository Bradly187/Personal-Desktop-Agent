name: CI - Metrics
on:
  push:
    paths:
      - '.github/**'
      - 'metrics.py'
      - 'tests/**'
      - 'continuous_trainer.py'
      - 'hybrid_coordinator.py'
      - 'main.py'
  pull_request:
    paths:
      - '.github/**'
      - 'metrics.py'
      - 'tests/**'
      - 'continuous_trainer.py'
      - 'hybrid_coordinator.py'
      - 'main.py'
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run metrics tests
        run: |
          pytest -q tests/test_metrics_integration.py
