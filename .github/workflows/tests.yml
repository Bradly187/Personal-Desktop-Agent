name: CI Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.lock
        
      - name: Run pytest with coverage
        run: |
          pip install pytest-cov
          pytest --cov=core --cov=inference --cov=storage --cov=monitoring --cov=sensors --cov=adaptive --cov=desktop --cov=evals --cov-report=term --cov-report=xml
          
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.lock mypy
        
      - name: Run mypy on monitoring
        run: mypy --ignore-missing-imports monitoring/
