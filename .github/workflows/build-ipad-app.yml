name: Build iPad App

on:
  push:
    branches:
      - main
      - mvp
    paths:
      - 'iPadApp/**'
      - '.github/workflows/build-ipad-app.yml'
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: 'Upload to TestFlight after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Find the latest Xcode 26.x installed
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found, listing available:"
            ls /Applications/Xcode*.app
            exit 1
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$CERTIFICATE_P12" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH

          # Install to the standard location
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV

      - name: Generate Xcode project
        run: |
          cd iPadApp/DesktopAgent
          xcodegen generate
          # Stamp CI run number into the generated Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build and archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd iPadApp/DesktopAgent
          xcodebuild archive \
            -project DesktopAgent.xcodeproj \
            -scheme DesktopAgent \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/DesktopAgent.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.bradtarver.DesktopAgent \
            2>&1 | tee build.log

          if grep -q "ARCHIVE SUCCEEDED" build.log; then
            echo "Archive succeeded!"
          else
            echo "Archive failed. Last 50 lines:"
            tail -50 build.log
            exit 1
          fi

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bradtarver.DesktopAgent</key>
              <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DesktopAgent.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

          echo "Exported IPA:"
          ls -la $RUNNER_TEMP/export/*.ipa

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_testflight == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # Write API key file to the directory altool expects
          # altool searches: ./private_keys/ and ~/private_keys/
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Verify key file looks valid
          echo "API Key ID: $ASC_KEY_ID"
          echo "Issuer ID: $ASC_ISSUER_ID"
          echo "Key file size: $(wc -c < "$KEY_FILE") bytes"
          echo "Key file first line: $(head -1 "$KEY_FILE")"
          echo "Key file last line: $(tail -1 "$KEY_FILE")"
          echo "Key file line count: $(wc -l < "$KEY_FILE")"

          # Find the exported IPA
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload using xcrun altool (key discovered from ~/private_keys/)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log

          if grep -q "No errors uploading" upload.log; then
            echo "✅ Upload succeeded! Build will appear in TestFlight shortly."
          else
            echo "⚠️ altool failed. Trying xcodebuild -exportArchive with direct upload..."

            xcodebuild -exportArchive \
              -archivePath $RUNNER_TEMP/DesktopAgent.xcarchive \
              -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
              -exportPath $RUNNER_TEMP/upload-export \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_FILE" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              2>&1 | tee upload2.log

            if grep -q "EXPORT SUCCEEDED\|Upload Succeeded" upload2.log; then
              echo "✅ Upload succeeded via xcodebuild! Build will appear in TestFlight shortly."
            else
              echo "❌ Both upload methods failed."
              echo ""
              echo "TROUBLESHOOTING:"
              echo "1. Verify ASC_KEY_ID matches the Key ID in App Store Connect → Integrations"
              echo "2. Verify ASC_ISSUER_ID matches the Issuer ID at the top of that page"
              echo "3. Verify the API key has Admin or App Manager access (not Developer)"
              echo "4. Verify the key status is Active (not revoked)"
              echo "5. Verify ASC_PRIVATE_KEY contains the full .p8 file including BEGIN/END lines"
              exit 1
            fi
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAgent-signed
          path: ${{ runner.temp }}/export/DesktopAgent.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
