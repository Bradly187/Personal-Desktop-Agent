name: Build iPad App

on:
  push:
    paths:
      - 'iPadApp/**'
      - '.github/workflows/build-ipad-app.yml'
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: 'Upload to TestFlight after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Least privilege: build/test only need checkout; signing uses repo secrets,
# not the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$CERTIFICATE_P12" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH

          # Install to the standard location
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV

      - name: Generate Xcode project
        run: |
          cd iPadApp/DesktopAgent
          xcodegen generate
          # Stamp CI run number into the generated Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Install iOS platform
        run: |
          # Xcode 26.4.1 ships with the iOS 26 SDK required by App Store Connect
          # (validation rejected iOS 18.5-built IPAs as of May 2026). The macos-26
          # runner image has the matching iOS 26 simulator pre-installed.
          xcodebuild -downloadPlatform iOS || true

      - name: Build and archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd iPadApp/DesktopAgent
          xcodebuild archive \
            -project DesktopAgent.xcodeproj \
            -scheme DesktopAgent \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/DesktopAgent.xcarchive \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.bradtarver.DesktopAgent \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=NO \
            2>&1 | tee build.log

          if grep -q "ARCHIVE SUCCEEDED" build.log; then
            echo "Archive succeeded!"
          else
            echo "Archive failed. Last 50 lines:"
            tail -50 build.log
            exit 1
          fi

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bradtarver.DesktopAgent</key>
              <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DesktopAgent.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

          echo "Exported IPA:"
          ls -la $RUNNER_TEMP/export/*.ipa

      - name: Upload to TestFlight
        if: ${{ github.ref == 'refs/heads/master' || github.event.inputs.deploy_testflight == 'true' }}
        continue-on-error: true  # Non-fatal: App Store may reject older SDK builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # Write API key file
          KEY_DIR="$HOME/.private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Find the exported IPA
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Upload using xcrun altool (works with API key auth)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log

          if grep -q "No errors uploading" upload.log; then
            echo "✅ Upload succeeded! Build will appear in TestFlight shortly."
          elif grep -q "SDK version issue" upload.log; then
            echo "⚠️ TestFlight rejected the build for SDK reasons. This should not happen on Xcode 26 — investigate."
          else
            echo "⚠️ Upload may have failed. Check App Store Connect."
            cat upload.log
          fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Transient ECONNRESET on macOS runners; IPA still in runner temp
        with:
          name: DesktopAgent-signed
          path: ${{ runner.temp }}/export/DesktopAgent.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  # IG-6 (2026-07-05 audit): the 20 XCTest files in iPadApp/Tests never ran in
  # CI despite this workflow already paying for a macOS runner. Runs in
  # parallel with build; no signing (simulator). Test target + scheme are
  # defined in iPadApp/DesktopAgent/project.yml (DesktopAgentTests).
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iPadApp/DesktopAgent
          xcodegen generate

      - name: Install iOS platform
        run: xcodebuild -downloadPlatform iOS || true

      - name: Run unit tests (iPad Simulator)
        shell: bash
        run: |
          cd iPadApp/DesktopAgent
          # App is iPad-only (TARGETED_DEVICE_FAMILY=2) — pick any available iPad sim.
          DEST_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(dev['udid'] for runtime, devs in devices.items()
                     if 'iOS' in runtime for dev in devs
                     if dev['isAvailable'] and 'iPad' in dev['name']))")
          echo "Using simulator: $DEST_ID"
          xcodebuild test \
            -project DesktopAgent.xcodeproj \
            -scheme DesktopAgent \
            -destination "id=$DEST_ID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|warning: .*Tests|Test Suite|Test Case.*(passed|failed)|TEST" | tail -80
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-test-log
          path: iPadApp/DesktopAgent/test.log
          retention-days: 7
