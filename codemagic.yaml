workflows:
  ios-unsigned-build:
    name: Build Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        PROJECT_DIR: iPadApp/DesktopAgent

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $PROJECT_DIR
          xcodegen generate
          echo "Generated project files:"
          ls -la

      - name: Build unsigned IPA
        script: |
          cd $PROJECT_DIR
          xcodebuild \
            -project DesktopAgent.xcodeproj \
            -scheme DesktopAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build \
            build

      - name: Package unsigned IPA
        script: |
          mkdir -p $CM_BUILD_DIR/output
          cd $CM_BUILD_DIR/build
          mkdir -p Payload
          cp -r DesktopAgent.app Payload/
          zip -r $CM_BUILD_DIR/output/DesktopAgent-unsigned.ipa Payload/
          echo "IPA created at: $CM_BUILD_DIR/output/DesktopAgent-unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
